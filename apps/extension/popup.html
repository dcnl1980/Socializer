<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: Georgia, serif;
        width: 280px;
        margin: 0;
        padding: 12px;
        background: #102016;
        color: #e8f0e9;
      }
      label {
        display: grid;
        gap: 4px;
        margin-bottom: 8px;
        font-size: 12px;
      }
      input,
      button {
        font: inherit;
        padding: 8px;
      }
      button {
        width: 100%;
        background: #c4f542;
        border: 0;
        font-weight: 700;
        cursor: pointer;
      }
      #status {
        margin-top: 8px;
        font-size: 12px;
        color: #9bb0a0;
      }
    </style>
  </head>
  <body>
    <strong>Socializer</strong>
    <p style="font-size: 12px; color: #9bb0a0">Capture-only lead saver</p>
    <label>
      API origin
      <input id="origin" value="http://localhost:3000" />
    </label>
    <label>
      List ID
      <input id="listId" placeholder="uuid from /leads" />
    </label>
    <button id="save">Save current profile</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
